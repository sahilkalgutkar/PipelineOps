name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingestion-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    # This service talks to Postgres and Redis, so its tests need both to be
    # real. Without them the db and cache suites skip themselves and the job
    # still goes green while testing almost nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipelineops
          POSTGRES_PASSWORD: pipelineops
          POSTGRES_DB: pipelineops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      INGESTION_TEST_DATABASE_URL: postgres://pipelineops:pipelineops@localhost:5432/pipelineops
      INGESTION_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: ingestion-service/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core-api/requirements.txt

      # The ingestion service reads and writes tables Django owns the
      # migrations for, and it deliberately never runs migrations itself. So
      # the schema its tests need has to come from the same place production's
      # does — running Django's migrations — rather than from a copy of the
      # DDL kept in this service, which would drift the first time a model
      # changed.
      - name: apply the schema Django owns
        working-directory: core-api
        env:
          DATABASE_URL: postgres://pipelineops:pipelineops@localhost:5432/pipelineops
          DJANGO_SECRET_KEY: ci-test-key
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ingestion-service
      - run: go build ./...
      - run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

      # The suites skip themselves when Postgres or Redis is unreachable,
      # which is the right behaviour locally and a silent failure here. If the
      # containers above ever stop being wired up correctly, this fails the
      # job instead of quietly reporting a much smaller test run.
      - name: no test skipped for a missing dependency
        run: |
          if go test ./... -v 2>&1 | grep -E "skipping: no reachable (postgres|redis)"; then
            echo "::error::integration tests skipped — the postgres/redis service containers are not reachable"
            exit 1
          fi
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ingestion-service/coverage.out
          flags: ingestion-service
          fail_ci_if_error: false

  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipelineops
          POSTGRES_PASSWORD: pipelineops
          POSTGRES_DB: pipelineops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pipelineops:pipelineops@localhost:5432/pipelineops
      DJANGO_SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: coverage run manage.py test
      - run: coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core-api/coverage.xml
          flags: core-api
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - run: npm run build
