name: pipelineops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelineops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipelineops}
      POSTGRES_DB: ${POSTGRES_DB:-pipelineops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelineops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build: ./core-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-pipelineops}:${POSTGRES_PASSWORD:-pipelineops}@postgres:5432/${POSTGRES_DB:-pipelineops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DJANGO_CREATE_SUPERUSER: ${DJANGO_CREATE_SUPERUSER:-true}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@pipelineops.local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15

  celery-worker:
    build: ./core-api
    command: celery -A pipelineops worker -l info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-pipelineops}:${POSTGRES_PASSWORD:-pipelineops}@postgres:5432/${POSTGRES_DB:-pipelineops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      core-api:
        condition: service_healthy

  celery-beat:
    build: ./core-api
    command: celery -A pipelineops beat -l info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-pipelineops}:${POSTGRES_PASSWORD:-pipelineops}@postgres:5432/${POSTGRES_DB:-pipelineops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HEARTBEAT_CHECK_INTERVAL_SECONDS: ${HEARTBEAT_CHECK_INTERVAL_SECONDS:-30}
    depends_on:
      core-api:
        condition: service_healthy

  ingestion:
    build: ./ingestion-service
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-pipelineops}:${POSTGRES_PASSWORD:-pipelineops}@postgres:5432/${POSTGRES_DB:-pipelineops}
      REDIS_URL: redis://redis:6379/0
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      # alpine:3.19 (the runtime image) has busybox wget but no curl, unlike
      # core-api's image — see ingestion-service/Dockerfile.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
