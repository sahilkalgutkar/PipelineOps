# Template only — do NOT apply this file as-is or commit real secrets.
#
# Create the real secret imperatively instead, e.g.:
#   kubectl create secret generic pipelineops-secrets -n pipelineops \
#     --from-literal=DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL="postgres://pipelineops:<password>@postgres:5432/pipelineops" \
#     --from-literal=SLACK_WEBHOOK_URL=... \
#     --from-literal=EMAIL_HOST_PASSWORD=... \
#     --from-literal=TWILIO_AUTH_TOKEN=...
#
# DATABASE_URL is templated here (not derived from POSTGRES_PASSWORD by k8s)
# because Django, Celery, and the Go ingestion service each just want one
# connection string — on RDS, swap it for the RDS endpoint/credentials.
#
# On EKS, prefer External Secrets Operator backed by AWS Secrets Manager
# instead of kubectl-managed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: pipelineops-secrets
  namespace: pipelineops
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "change-me"
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgres://pipelineops:change-me@postgres:5432/pipelineops"
  SLACK_WEBHOOK_URL: ""
  EMAIL_HOST_PASSWORD: ""
  TWILIO_AUTH_TOKEN: ""
