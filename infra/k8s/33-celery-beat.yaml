# replicas must stay at 1 — celery beat is a scheduler, not a worker; running
# more than one instance double-fires every periodic task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: pipelineops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: pipelineops-core-api:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "pipelineops", "beat", "-l", "info"]
          envFrom:
            - configMapRef:
                name: pipelineops-config
            - secretRef:
                name: pipelineops-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
