# Non-secret configuration shared across services.
# On AWS, DATABASE_URL/REDIS_URL point at RDS/ElastiCache instead of the
# in-cluster postgres/redis used here for a local kind cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelineops-config
  namespace: pipelineops
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://pipelineops.local"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  HEARTBEAT_CHECK_INTERVAL_SECONDS: "30"
  # NOTE: the frontend is a static build — VITE_API_BASE_URL is baked in at
  # `docker build --build-arg` time (see frontend/Dockerfile), not read from
  # this ConfigMap at runtime.
