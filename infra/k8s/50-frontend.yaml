apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pipelineops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build with: docker build --build-arg VITE_API_BASE_URL=http://pipelineops.local/api
          image: pipelineops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pipelineops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
